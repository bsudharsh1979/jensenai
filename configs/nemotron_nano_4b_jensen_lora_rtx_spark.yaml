# NeMo AutoModel recipe: LoRA SFT of NVIDIA-Nemotron-3-Nano-4B on the Jensen Huang / NVIDIA
# Q&A dataset, tuned for a single DGX Spark (GB10, 128 GB unified memory).
#
# Derived from the official recipes
#   examples/llm_finetune/nemotron/nemotron_nano_4b_squad_peft.yaml        (model + LoRA exclusions)
#   examples/llm_finetune/llama3_1/llama3_1_8b_squad_peft_rtx_spark.yaml   (Spark memory settings)
# and the NeMo AutoModel SFT/PEFT guide (chat JSONL dataset, answer-only loss, LoRA rank/alpha).
#
# Run (inside nvcr.io/nvidia/nemo-automodel:26.08, see scripts/05_train_nemo_automodel.sh):
#   automodel /workspace/configs/nemotron_nano_4b_jensen_lora_rtx_spark.yaml --nproc-per-node 1

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  # Small local batch + gradient accumulation keeps activations inside the unified-memory budget.
  global_batch_size: 8
  local_batch_size: 2
  num_epochs: 3
  ckpt_every_steps: 100
  val_every_steps: 25

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
  torch_dtype: bf16
  trust_remote_code: true
  # Avoid slow file-backed mmap page migration during HF's CPU->CUDA move on Spark UMA.
  disable_mmap: true

compile:
  enabled: false

checkpoint:
  enabled: true
  checkpoint_dir: /workspace/checkpoints/nemotron_nano_4b_jensen_lora
  model_save_format: safetensors
  save_consolidated: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  # Mamba-2 out_proj uses fused kernels that read out_proj.weight directly; LoRA cannot hook it.
  exclude_modules: ["*.out_proj"]
  dim: 16          # rank 8-32 recommended; 16 for a knowledge-heavy domain task
  alpha: 32        # alpha = 2 * rank
  dropout: 0.05
  use_triton: true

distributed:
  strategy: fsdp2
  dp_size: null
  tp_size: 1     # dense Nemotron-H custom path is FSDP2-only
  cp_size: 1
  sequence_parallel: false
  # Full activation recomputation bounds memory on the shared UMA budget (Spark recipe setting).
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /workspace/data/sft/train.jsonl
  split: train
  seq_length: 2048
  padding: do_not_pad
  truncation: longest_first
  skip_invalid_samples: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /workspace/data/sft/val.jsonl
  split: validation
  seq_length: 2048
  padding: do_not_pad
  truncation: longest_first
  skip_invalid_samples: true

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-4        # LoRA learning rate (10x the full-SFT default)
  weight_decay: 0.01

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 20
  min_lr: 1.0e-5
