<text x="60" y="68" fill="#f3f4f6" font-size="38" font-weight="800">JensenAI <tspan fill="#76B900">·</tspan> technical architecture</text>
<text x="60" y="100" fill="#9aa3af" font-size="17">Fine-tuning method, retrieval design, serving stack, answer pipeline and the human-feedback loop — all running on one NVIDIA DGX Spark (GB10, 128 GB unified memory).</text>
