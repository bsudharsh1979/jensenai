<text x="912" y="190" fill="#f3f4f6" font-size="21" font-weight="700">Hybrid dense + lexical retrieval with quality priors</text>
<text x="914" y="242" fill="#4fb3ff" font-size="26" font-weight="800">2,389</text>
<text x="914" y="262" fill="#9aa3af" font-size="12.5" letter-spacing="1">INDEXED CHUNKS</text>
<text x="1130" y="242" fill="#4fb3ff" font-size="26" font-weight="800">173</text>
<text x="1130" y="262" fill="#9aa3af" font-size="12.5" letter-spacing="1">DOCUMENTS</text>
<text x="1320" y="242" fill="#4fb3ff" font-size="26" font-weight="800">2048</text>
<text x="1320" y="262" fill="#9aa3af" font-size="12.5" letter-spacing="1">EMBEDDING DIMS</text>
<circle cx="922" cy="297" r="3.5" fill="#4fb3ff"/>
<text x="936" y="302" fill="#9aa3af" font-size="13.5">Dense: Nemotron-3-Embed-1B (2048-d cosine) over 350-word passages with title + date</text>
<circle cx="922" cy="324" r="3.5" fill="#4fb3ff"/>
<text x="936" y="329" fill="#9aa3af" font-size="13.5">Lexical: BM25 over title + date + text, so event names in video titles are matchable</text>
<circle cx="922" cy="351" r="3.5" fill="#4fb3ff"/>
<text x="936" y="356" fill="#9aa3af" font-size="13.5">Fusion: Reciprocal Rank Fusion (k=60) × source-quality prior (transcripts ↑, reaction streams ↓)</text>
<circle cx="922" cy="378" r="3.5" fill="#4fb3ff"/>
<text x="936" y="383" fill="#9aa3af" font-size="13.5">Diversity: per-document cap (3 for high-quality docs, 1 otherwise), 60 candidates → top 8</text>
<circle cx="922" cy="405" r="3.5" fill="#4fb3ff"/>
<text x="936" y="410" fill="#9aa3af" font-size="13.5">Conversation-aware: follow-ups retrieved with the previous question merged in</text>
<circle cx="922" cy="432" r="3.5" fill="#4fb3ff"/>
<text x="936" y="437" fill="#9aa3af" font-size="13.5">Citation guarantee: uncited paragraphs get one embedding-attributed [n] (cos ≥ 0.38)</text>
<circle cx="922" cy="459" r="3.5" fill="#4fb3ff"/>
<text x="936" y="464" fill="#9aa3af" font-size="13.5">Feedback-weighted: passages cited in 'bad' answers down-weighted ×0.7 for similar questions</text>
