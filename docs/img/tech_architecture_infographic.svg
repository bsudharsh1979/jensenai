<text x="82" y="162" fill="#76B900" font-size="13" font-weight="700" letter-spacing="2">FINE-TUNING METHOD</text>
<text x="82" y="190" fill="#f3f4f6" font-size="21" font-weight="700">Parameter-efficient LoRA SFT with NeMo AutoModel</text>
<text x="84" y="242" fill="#76B900" font-size="26" font-weight="800">19.2M / 0.48%</text>
<text x="84" y="262" fill="#9aa3af" font-size="12.5" letter-spacing="1">TRAINABLE PARAMS</text>
<text x="330" y="242" fill="#76B900" font-size="26" font-weight="800">r16 · α32 · 0.05</text>
<text x="330" y="262" fill="#9aa3af" font-size="12.5" letter-spacing="1">RANK · ALPHA · DROPOUT</text>
<text x="600" y="242" fill="#76B900" font-size="26" font-weight="800">6.5 min</text>
<text x="600" y="262" fill="#9aa3af" font-size="12.5" letter-spacing="1">TRAIN TIME (GB10)</text>
<circle cx="92" cy="297" r="3.5" fill="#76B900"/>
<text x="106" y="302" fill="#9aa3af" font-size="13.5">Student: Nemotron-3-Nano-4B-BF16 — dense hybrid Mamba-2 + Transformer (nemotron_h)</text>
<circle cx="92" cy="324" r="3.5" fill="#76B900"/>
<text x="106" y="329" fill="#9aa3af" font-size="13.5">Data: 719 grounded Q&amp;A pairs synthesised by Nemotron-3-Super (3 per passage)</text>
<circle cx="92" cy="351" r="3.5" fill="#76B900"/>
<text x="106" y="356" fill="#9aa3af" font-size="13.5">Recipe: NeMo AutoModel 26.08 · LoRA on attention + MLP, *.out_proj excluded (Mamba frozen)</text>
<circle cx="92" cy="378" r="3.5" fill="#76B900"/>
<text x="106" y="383" fill="#9aa3af" font-size="13.5">Optimiser: AdamW 1e-4 cosine · bf16 · FSDP2 · 3 epochs / 249 steps · lowest-val-loss checkpoint</text>
<circle cx="92" cy="405" r="3.5" fill="#76B900"/>
<text x="106" y="410" fill="#9aa3af" font-size="13.5">Loss: train 2.50 → 1.06 · val 2.01 → 1.72 (held-out set of 57 questions)</text>
<circle cx="92" cy="432" r="3.5" fill="#76B900"/>
<text x="106" y="437" fill="#9aa3af" font-size="13.5">Merge: pure-tensor W' = W + (α/r)·B·A — Mamba dt_bias / out_proj never re-initialised</text>
<circle cx="92" cy="459" r="3.5" fill="#76B900"/>
<text x="106" y="464" fill="#9aa3af" font-size="13.5">Export: llama.cpp GGUF bf16 (raw-config hparams) → Ollama Modelfile, explicit ChatML template</text>
<text x="84" y="500" fill="#76B900" font-size="13" font-weight="700" letter-spacing="2">HELD-OUT RESULT · BASE → FINE-TUNED</text>
<text x="84" y="530" fill="#f3f4f6" font-size="16">Token F1 0.313 → <tspan fill="#76B900" font-weight="700">0.380</tspan>   ·   ROUGE-L 0.207 → <tspan fill="#76B900" font-weight="700">0.273</tspan>   ·   Super-as-judge 1.42 → <tspan fill="#76B900" font-weight="700">1.91</tspan> / 5   ·   wins 47 / 57</text>
